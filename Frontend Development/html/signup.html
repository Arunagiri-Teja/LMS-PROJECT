<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS Pro — Sign Up</title>
  <link rel="stylesheet" href="../css/signup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>
<body>
  <!-- Background Shapes -->
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="signup-container">
    <div class="signup-card">
      <h2>Join LMS Pro </h2>
      <p>Create your account to start learning today.</p>
      <form id="signup-form">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" placeholder="Full Name" required />
        </div>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email Address" required />
        </div>
          <div class="input-group password-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required />
            <span class="toggle-password" id="togglePassword">&#128065;</span>
          </div>
          <div class="input-group password-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
            <span class="toggle-password" id="toggleConfirmPassword">&#128065;</span>
          </div>
        <button type="submit">Register</button>
      </form>
      <p class="login-text">
        Already have an account? <a href="../html/login.html">Login</a>
      </p>
      <a href="../homepage.html" class="backhome">← Back to Home</a>
    </div>
  </div>

  <script src="../js/signup.js"></script>
</body>
</html>

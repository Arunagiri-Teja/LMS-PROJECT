<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS Pro — Login</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script> 
</head>
<body>
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h2>Welcome Back 👋</h2>
      <p>Login to continue your learning journey.</p>
      <form>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" placeholder="Username" required />
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Password" required />
          <span class="toggle-password fas fa-eye fa-xs" id="togglePassword">&#128065;</span>
        </div>
<!-- 
        <div class="password-field">
        <input type="password" id="passwordInput" placeholder="Password" required />
        <span class="toggle-password" id="togglePassword">&#128065;</span>
        </div> -->


        <div class="options">
          <label class="checkbox-container">
            <input type="checkbox" />
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="./forget-password.html" style="color: #8E44AD;">Forgot Password?</a>
        </div>

        <button type="submit" class="signin-btn">Sign In</button>
      </form>
      <p class="register-text">
        Don’t have an account? <a href="../html/signup.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>

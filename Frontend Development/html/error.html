<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Error - LMS Pro</title>
  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: rgba(255, 229, 128, 0.3);
  color: #333;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

/* Bubbles Container */
.bubbles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* so bubbles don't block clicks */
  overflow: hidden;
  z-index: 0;
}

.bubbles span {
  position: absolute;
  display: block;
  width: 20px;
  height: 20px;
  background: rgba(255, 223, 80, 0.3);
  border-radius: 50%;
  animation: bubble 15s linear infinite;
  bottom: -50px;
}

/* random sizes */
.bubbles span:nth-child(1) {
  left: 10%;
  width: 25px;
  height: 25px;
  animation-duration: 12s;
}
.bubbles span:nth-child(2) {
  left: 20%;
  width: 15px;
  height: 15px;
  animation-duration: 18s;
}
.bubbles span:nth-child(3) {
  left: 35%;
  width: 30px;
  height: 30px;
  animation-duration: 10s;
}
.bubbles span:nth-child(4) {
  left: 50%;
  width: 20px;
  height: 20px;
  animation-duration: 16s;
}
.bubbles span:nth-child(5) {
  left: 65%;
  width: 18px;
  height: 18px;
  animation-duration: 14s;
}
.bubbles span:nth-child(6) {
  left: 80%;
  width: 22px;
  height: 22px;
  animation-duration: 20s;
}
@keyframes bubble {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0.8;
  }
  50% {
    opacity: 0.4;
  }
  100% {
    transform: translateY(-1200px) scale(0.5);
    opacity: 0;
  }
} 

.error-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1000px;
  width: 100%;
  background: #fff9e6b3; /* #fff9e6 + B3 opacity (~70%) */
  border-radius: 20px;
  padding: 40px;
  gap: 30px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(245, 176, 65, 0.2);

}


.error-text {
  flex: 1;
}

.error-text h1 {
  font-size: 120px;
  color: #E67E22;
  transition: color 0.3s ease;
}

.error-text h2 {
  font-size: 32px;
  color: #333;
  margin-bottom: 15px;
}

.error-text p {
  font-size: 18px;
  color: #666;
  margin-bottom: 30px;
}

.error-text a {
  display: inline-block;
  padding: 12px 24px;
  background-color: #E67E22;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  border-radius: 8px;
  transition: background 0.3s ease;
}

.error-text a:hover {
  background-color: #6C3483;
}

.error-image img {
  max-width: 350px;
  width: 100%;
  height: auto;
}

/* Responsive */
@media (max-width: 768px) {
  .error-container {
    flex-direction: column;
    text-align: center;
  }

  .error-image img {
    max-width: 250px;
  }
}
  </style>
</head>
<body>
   <div class="bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="error-container">
    <div class="error-text">
      <h1>404</h1>
      <h2>Oops! Page Not Found</h2>
      <p>Sorry, the page you’re looking for doesn’t exist or has been moved.</p>
      <a href="../homepage.html">Go to Homepage</a>
    </div>
    <div class="error-image">
      <img src="../Assets/404 Error with a cute animal-cuate.svg" alt="404 illustration">
    </div>
  </div>
</body>
</html>
